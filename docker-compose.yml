version: '3.8'
services:
  carla_server:
    image: carlasim/carla:0.9.13
    runtime: nvidia
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash CarlaUE4.sh -nosound

  ros_client:
    image: goldfish1295/carla_ros_client:0.9.13-foxy-cn
    container_name: ros_client
    runtime: nvidia
    network_mode: host
    tty: true
    stdin_open: true
    # 设备挂载
    devices:
      - /dev/snd:/dev/snd
      - /dev/dri:/dev/dri
    # 环境变量
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # 目录挂载
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../:/root/ros2_ws:rw